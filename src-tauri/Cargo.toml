[package]
name = "moomole"
version = "0.1.0"
description = "A local-first desktop research project powered by Mole CLI"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "moomole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["process", "fs", "io-util", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
sha2 = "0.10"

tempfile = "3"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy"] }
semver = "=1.0.28"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "=0.8.7"

objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL", "NSData", "NSDictionary", "NSGeometry"] }

objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "objc2-core-foundation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
