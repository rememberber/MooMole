name: Candidate installers

on:
  push:
    branches: ['codex/release-candidate-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.21.0'
  GO_VERSION: '1.26.0'
  RUSTUP_TOOLCHAIN: '1.99.0'
  CARGO_INCREMENTAL: '0'

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  installers:
    name: Validated release candidate (${{ matrix.arch }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      CANDIDATE_DIR: ci-artifacts/installer-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Verify host architecture
        run: node -e 'if (process.platform !== "darwin" || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - run: npm ci
      - name: Build ad-hoc release App and validated DMG without Apple credentials
        id: build
        run: |
          npm run build:local-dmg
          node --input-type=module <<'JS'
          import { appendFileSync, readdirSync } from 'node:fs'
          import { join } from 'node:path'
          import { checkVersion } from './scripts/version.mjs'
          const prefix = `MooMole-${checkVersion(process.cwd())}-mac-${process.arch}-`
          const stages = readdirSync('local-artifacts').filter(name => name.startsWith(prefix))
          if (stages.length !== 1) throw Error('Expected exactly one fresh candidate build')
          appendFileSync(process.env.GITHUB_OUTPUT, `report=${join('local-artifacts', stages[0], 'validation.json')}\n`)
          JS
      - name: Bind installer, source and dependency packets to the same clean build
        env:
          APP_REPORT: ${{ steps.build.outputs.report }}
        run: |
          node scripts/candidate-artifacts.mjs stage --report "$APP_REPORT" --output "$CANDIDATE_DIR"
          npm run source:bundle -- --output "$CANDIDATE_DIR/source" --app-report "$APP_REPORT"
          npm run source:dependencies -- --output "$CANDIDATE_DIR/dependencies" --app-report "$APP_REPORT"
          npm run source:npm -- --output "$CANDIDATE_DIR/npm-source" --app-report "$APP_REPORT" --dependency-report "$CANDIDATE_DIR/dependencies/validation.json"
          node scripts/candidate-artifacts.mjs seal --output "$CANDIDATE_DIR"
      - name: Keep candidate evidence (no public Release or update manifest)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-mac-${{ matrix.arch }}
          path: ${{ env.CANDIDATE_DIR }}/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
